<svg width="320" height="360" viewBox="0 0 320 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <clipPath id="frame2"><rect x="0" y="0" width="320" height="360" rx="28"/></clipPath>
  </defs>

  <rect x="0" y="0" width="320" height="360" rx="28" fill="#0b0b0d"/>
  <g clip-path="url(#frame2)">

    <!-- header -->
    <text x="20" y="44" fill="#ff453a" font-size="22" font-weight="700">Not passed.</text>
    <rect x="248" y="24" width="60" height="26" rx="13" fill="#2c1616"/>
    <text x="278" y="42" text-anchor="middle" fill="#ff453a" font-size="12" font-weight="700">Strict 31</text>

    <!-- expected / recognized rows -->
    <text x="20" y="72" fill="#98989f" font-size="13">Expected</text>
    <text x="120" y="72" fill="#e5e5e7" font-size="13" font-weight="600">mã</text>
    <text x="20" y="92" fill="#98989f" font-size="13">Recognized</text>
    <text x="120" y="92" fill="#e5e5e7" font-size="13" font-weight="600">Mã mã.</text>

    <!-- chart card -->
    <rect x="20" y="112" width="280" height="150" rx="12" fill="#1c1c1e"/>

    <!-- legend -->
    <line x1="34" y1="130" x2="52" y2="130" stroke="#0a84ff" stroke-width="2.5"/>
    <text x="58" y="134" fill="#98989f" font-size="11.5">You</text>
    <line x1="90" y1="130" x2="108" y2="130" stroke="#8e8e93" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="114" y="134" fill="#98989f" font-size="11.5">Expected</text>

    <!-- baseline -->
    <line x1="34" y1="195" x2="286" y2="195" stroke="#3a3a3c" stroke-width="1"/>

    <!-- expected: gentle dip then rise, full width, dashed -->
    <path d="M 34,180 C 80,186 100,206 148,208 C 190,210 220,190 286,150"
          fill="none" stroke="#8e8e93" stroke-width="2" stroke-dasharray="5 4"/>
    <circle cx="160" cy="209" r="3" fill="#ff9f0a"/>

    <!-- actual: dip + gap + sharp rise, matches the on-device nga shape -->
    <path d="M 34,182 C 60,190 80,206 108,222" fill="none" stroke="#0a84ff" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="122" cy="228" r="2.5" fill="#ff9f0a"/>
    <path d="M 136,224 C 160,204 180,168 214,150 C 236,138 252,132 268,128"
          fill="none" stroke="#0a84ff" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="268" cy="128" r="5" fill="#0a84ff" stroke="#1c1c1e" stroke-width="2"/>

    <!-- feedback card -->
    <rect x="20" y="276" width="280" height="66" rx="12" fill="#1c1c1e"/>
    <text x="34" y="298" fill="#ff453a" font-size="12.5" font-weight="700">Extra speech</text>
    <text x="34" y="318" fill="#c7c7cc" font-size="11.5">Azure heard the word twice. Say the prompt</text>
    <text x="34" y="332" fill="#c7c7cc" font-size="11.5">once — the on-device contour shape was fine.</text>
  </g>
  <rect x="1" y="1" width="318" height="358" rx="27" fill="none" stroke="#2c2c2e" stroke-width="1.5"/>
</svg>
