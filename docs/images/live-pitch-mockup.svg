<svg width="320" height="420" viewBox="0 0 320 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <clipPath id="frame"><rect x="0" y="0" width="320" height="420" rx="28"/></clipPath>
  </defs>

  <rect x="0" y="0" width="320" height="420" rx="28" fill="#0b0b0d"/>
  <g clip-path="url(#frame)">

    <!-- prompt card -->
    <rect x="20" y="24" width="280" height="150" rx="14" fill="#1c1c1e"/>
    <text x="160" y="58" text-anchor="middle" fill="#98989f" font-size="13" font-weight="600">5 / 18</text>
    <text x="160" y="112" text-anchor="middle" fill="#ffffff" font-size="52" font-weight="700">mã</text>
    <text x="160" y="140" text-anchor="middle" fill="#e5e5e7" font-size="14" font-weight="600">Tone minimal pair · Northern / Hanoi</text>
    <text x="160" y="160" text-anchor="middle" fill="#98989f" font-size="13">ngã tone</text>

    <!-- record button -->
    <circle cx="160" cy="222" r="34" fill="#ff453a"/>
    <rect x="146" y="208" width="28" height="28" rx="6" fill="#0b0b0d"/>

    <text x="160" y="272" text-anchor="middle" fill="#ff453a" font-size="14" font-weight="600">Recording… 0:02</text>

    <!-- live pitch trace card -->
    <rect x="20" y="286" width="280" height="124" rx="12" fill="#1c1c1e"/>
    <text x="34" y="308" fill="#98989f" font-size="12" font-weight="600">Live pitch</text>
    <text x="286" y="308" text-anchor="end" fill="#636366" font-size="11">voiced</text>

    <!-- baseline grid -->
    <line x1="34" y1="352" x2="286" y2="352" stroke="#3a3a3c" stroke-width="1"/>

    <!-- scrolling pitch line: dip then gap then sharp rise (nga shape) -->
    <path d="M 34,340 C 60,335 80,338 100,352 C 120,366 130,378 148,380 C 158,381 164,381 170,380"
          fill="none" stroke="#0a84ff" stroke-width="3" stroke-linecap="round"/>
    <!-- gap -->
    <circle cx="184" cy="376" r="2.5" fill="#ff9f0a"/>
    <path d="M 198,368 C 212,352 224,326 244,316 C 256,311 266,309 276,308"
          fill="none" stroke="#0a84ff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="276" cy="308" r="5" fill="#0a84ff" stroke="#1c1c1e" stroke-width="2"/>

    <text x="160" y="396" text-anchor="middle" fill="#636366" font-size="10.5">updates live as you speak —</text>
    <text x="160" y="409" text-anchor="middle" fill="#636366" font-size="10.5">no waiting for the recording to finish</text>
  </g>
  <rect x="1" y="1" width="318" height="418" rx="27" fill="none" stroke="#2c2c2e" stroke-width="1.5"/>
</svg>
